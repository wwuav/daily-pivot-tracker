name: Pivot Targets

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe (daily)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
  schedule:
    # Daily: fires as close to 8pm ET as GitHub's scheduler allows. Two UTC
    # times cover EDT/EST. Actual dedup against duplicate/delayed firings for
    # the SAME closed session happens via the cache step below, not a clock
    # check, so a late-running job still posts instead of silently skipping.
    - cron: '0 0 * * *'   # ~8pm EDT
    - cron: '0 1 * * *'   # ~8pm EST
    # Weekly: same idea, but only matches Monday-anchored cron slots.
    - cron: '0 0 * * 1'
    - cron: '0 1 * * 1'
    # Monthly: same idea, but only matches 1st-of-month cron slots.
    - cron: '0 0 1 * *'
    - cron: '0 1 1 * *'

jobs:
  daily-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'daily') ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 0 * * *' || github.event.schedule == '0 1 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Compute session key
        id: sesskey
        run: echo "key=$(python pivot_script.py daily key)" >> "$GITHUB_OUTPUT"

      - name: Check if this session was already posted
        if: github.event_name == 'schedule'
        id: cache
        uses: actions/cache@v4
        with:
          path: .posted-marker
          key: daily-posted-${{ steps.sesskey.outputs.key }}

      - name: Post daily pivots
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: python pivot_script.py daily
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

      - name: Mark session as posted
        if: github.event_name == 'schedule' && steps.cache.outputs.cache-hit != 'true'
        run: touch .posted-marker

  weekly-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'weekly') ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 0 * * 1' || github.event.schedule == '0 1 * * 1'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Compute session key
        id: sesskey
        run: echo "key=$(python pivot_script.py weekly key)" >> "$GITHUB_OUTPUT"

      - name: Check if this session was already posted
        if: github.event_name == 'schedule'
        id: cache
        uses: actions/cache@v4
        with:
          path: .posted-marker
          key: weekly-posted-${{ steps.sesskey.outputs.key }}

      - name: Post weekly pivots
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: python pivot_script.py weekly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

      - name: Mark session as posted
        if: github.event_name == 'schedule' && steps.cache.outputs.cache-hit != 'true'
        run: touch .posted-marker

  monthly-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'monthly') ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 0 1 * *' || github.event.schedule == '0 1 1 * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Compute session key
        id: sesskey
        run: echo "key=$(python pivot_script.py monthly key)" >> "$GITHUB_OUTPUT"

      - name: Check if this session was already posted
        if: github.event_name == 'schedule'
        id: cache
        uses: actions/cache@v4
        with:
          path: .posted-marker
          key: monthly-posted-${{ steps.sesskey.outputs.key }}

      - name: Post monthly pivots
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: python pivot_script.py monthly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

      - name: Mark session as posted
        if: github.event_name == 'schedule' && steps.cache.outputs.cache-hit != 'true'
        run: touch .posted-marker
