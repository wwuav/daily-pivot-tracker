name: Pivot Targets

on:
  schedule:
    - cron: "0 0 * * 2,3,4,5,6,0"  # Daily (Tue-Sun) at 00:00 UTC - skips Monday (weekly candle close)
    - cron: "0 0 * * 1"             # Weekly on Monday at 00:00 UTC = Sunday ~8 PM EST (weekly candle close)
    - cron: "0 0 1 * *"             # Monthly on 1st at 00:00 UTC = last day of month ~8 PM EST (monthly candle close)
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe (daily / weekly / monthly)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly

jobs:
  daily-pivots:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.timeframe == 'daily' ||
      github.event_name == 'schedule' && github.event.schedule == '0 0 * * 2,3,4,5,6,0'
    runs-on: ubuntu-latest
    steps:
      - name: Check if today is 1st of the month (skip - monthly job handles today)
        id: date_check
        run: |
          DAY=$(date -u +%d)
          if [ "$DAY" = "01" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Today is the 1st - skipping daily post (monthly job handles this candle)."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Exit early if 1st of the month
        if: steps.date_check.outputs.skip == 'true'
        run: |
          echo "Skipping daily post on the 1st of the month."
          exit 0
      - uses: actions/checkout@v4
        if: steps.date_check.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.date_check.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - run: pip install requests
        if: steps.date_check.outputs.skip != 'true'
      - run: python pivot_script.py daily
        if: steps.date_check.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

  weekly-pivots:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.timeframe == 'weekly' ||
      github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py weekly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

  monthly-pivots:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.timeframe == 'monthly' ||
      github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py monthly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}
