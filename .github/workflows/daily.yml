name: Pivot Targets

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe (daily)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
  schedule:
    # Daily: fires ~8pm ET every day. Two UTC times cover EDT/EST; the script
    # itself only actually posts if it's truly within ~10 min of real 8pm ET.
    - cron: '0 0 * * *'   # ~8pm EDT
    - cron: '0 1 * * *'   # ~8pm EST
    # Weekly: same idea, but the script also requires it to be Monday.
    - cron: '0 0 * * 1'
    - cron: '0 1 * * 1'
    # Monthly: same idea, but the script also requires it to be the 1st.
    - cron: '0 0 1 * *'
    - cron: '0 1 1 * *'

jobs:
  daily-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'daily') ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 0 * * *' || github.event.schedule == '0 1 * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py daily
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

  weekly-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'weekly') ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 0 * * 1' || github.event.schedule == '0 1 * * 1'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py weekly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

  monthly-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'monthly') ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 0 1 * *' || github.event.schedule == '0 1 1 * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py monthly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}
