name: Pivot Targets

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe (daily)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
  schedule:
    - cron: '0 0 * * *'    # Daily: every day at midnight UTC (8pm EST / 9pm EDT)
    - cron: '0 0 * * 1'    # Weekly: every Monday at midnight UTC
    - cron: '0 0 1 * *'    # Monthly: 1st of each month at midnight UTC

jobs:
  daily-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'daily') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py daily
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

  weekly-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'weekly') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py weekly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

  monthly-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'monthly') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python pivot_script.py monthly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}
