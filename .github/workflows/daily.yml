name: Pivot Targets

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe (daily)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
  schedule:
    # Runs every 15 min around the clock; the dedup cache in each job below
    # makes sure a session only posts once, so new daily/weekly/monthly
    # targets go out within ~15 min of closing.
    - cron: '*/15 * * * *' # Runs every 15 minutes

concurrency:
  group: pivot-targets
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      is_weekly_day: ${{ steps.check.outputs.is_weekly_day }}
      is_monthly_day: ${{ steps.check.outputs.is_monthly_day }}
    steps:
      - name: Determine if today is a weekly/monthly session day (ET)
        id: check
        run: |
          day_of_week=$(TZ="America/New_York" date +%u)
          day_of_month=$(TZ="America/New_York" date +%d)
          if [ "$day_of_week" = "1" ]; then
            echo "is_weekly_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_weekly_day=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$day_of_month" = "01" ]; then
            echo "is_monthly_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_monthly_day=false" >> "$GITHUB_OUTPUT"
          fi

  daily-pivots:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'daily') ||
      (github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Compute session key
        id: sesskey
        run: echo "key=$(python pivot_script.py daily key)" >> "$GITHUB_OUTPUT"

      - name: Check if this session was already posted
        id: cache
        uses: actions/cache@v4
        with:
          path: .posted-marker
          key: daily-posted-${{ steps.sesskey.outputs.key }}

      - name: Post daily pivots
        if: steps.cache.outputs.cache-hit != 'true'
        run: python pivot_script.py daily
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

      - name: Mark session as posted
        if: steps.cache.outputs.cache-hit != 'true'
        run: touch .posted-marker

  weekly-pivots:
    needs: schedule-gate
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'weekly') ||
      (github.event_name == 'schedule' && needs.schedule-gate.outputs.is_weekly_day == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Compute session key
        id: sesskey
        run: echo "key=$(python pivot_script.py weekly key)" >> "$GITHUB_OUTPUT"

      - name: Check if this session was already posted
        id: cache
        uses: actions/cache@v4
        with:
          path: .posted-marker
          key: weekly-posted-${{ steps.sesskey.outputs.key }}

      - name: Post weekly pivots
        if: steps.cache.outputs.cache-hit != 'true'
        run: python pivot_script.py weekly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

      - name: Mark session as posted
        if: steps.cache.outputs.cache-hit != 'true'
        run: touch .posted-marker

  monthly-pivots:
    needs: schedule-gate
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.timeframe == 'monthly') ||
      (github.event_name == 'schedule' && needs.schedule-gate.outputs.is_monthly_day == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Compute session key
        id: sesskey
        run: echo "key=$(python pivot_script.py monthly key)" >> "$GITHUB_OUTPUT"

      - name: Check if this session was already posted
        id: cache
        uses: actions/cache@v4
        with:
          path: .posted-marker
          key: monthly-posted-${{ steps.sesskey.outputs.key }}

      - name: Post monthly pivots
        if: steps.cache.outputs.cache-hit != 'true'
        run: python pivot_script.py monthly
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BTC: ${{ secrets.DISCORD_WEBHOOK_BTC }}

      - name: Mark session as posted
        if: steps.cache.outputs.cache-hit != 'true'
        run: touch .posted-marker
